<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="title desc">
  <title id="title">Coach Management System</title>
  <desc id="desc">A coaching management platform for bodybuilding, nutrition, corrective programs, online and in-person students, and an expandable exercise media library.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8fbff"/><stop offset="1" stop-color="#e9f7f1"/></linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#10233f"/><stop offset="1" stop-color="#173c55"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#10233f" flood-opacity=".12"/></filter>
  </defs>
  <rect width="1600" height="820" rx="36" fill="url(#bg)"/>
  <circle cx="130" cy="110" r="85" fill="#dff4ea"/><circle cx="1490" cy="700" r="120" fill="#e4eefc"/>
  <text x="800" y="100" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="70" font-weight="800" fill="#10233f">Coach <tspan fill="#14966f">Management</tspan> System</text>
  <text x="800" y="150" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" fill="#51647a">Coaching platform for bodybuilding, nutrition, and corrective programs</text>
  <text x="800" y="186" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#66798e">Built for online and in-person students with easy access to exercise media</text>
  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="19" font-weight="700">
    <rect x="180" y="220" width="150" height="48" rx="24" fill="#e4f7ef"/><text x="255" y="251" text-anchor="middle" fill="#176f58">JWT Auth</text>
    <rect x="350" y="220" width="160" height="48" rx="24" fill="#eaf1ff"/><text x="430" y="251" text-anchor="middle" fill="#2b63c0">Students</text>
    <rect x="530" y="220" width="160" height="48" rx="24" fill="#e4f7ef"/><text x="610" y="251" text-anchor="middle" fill="#176f58">Programs</text>
    <rect x="710" y="220" width="170" height="48" rx="24" fill="#eaf1ff"/><text x="795" y="251" text-anchor="middle" fill="#2b63c0">Exercises</text>
    <rect x="900" y="220" width="190" height="48" rx="24" fill="#e4f7ef"/><text x="995" y="251" text-anchor="middle" fill="#176f58">PostgreSQL</text>
    <rect x="1110" y="220" width="160" height="48" rx="24" fill="#eaf1ff"/><text x="1190" y="251" text-anchor="middle" fill="#2b63c0">REST API</text>
  </g>
  <g filter="url(#shadow)">
    <rect x="85" y="320" width="380" height="350" rx="28" fill="#ffffff"/>
    <text x="125" y="370" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#10233f">Programs</text>
    <text x="125" y="400" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16" font-weight="700" fill="#b06a24">PLANNED WORKFLOWS</text>
    <circle cx="140" cy="455" r="22" fill="#eaf1ff"/><text x="180" y="451" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#18314f">Bodybuilding</text><text x="180" y="478" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#66798e">Training plans + exercise selection</text>
    <circle cx="140" cy="535" r="22" fill="#e4f7ef"/><text x="180" y="531" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#18314f">Nutrition</text><text x="180" y="558" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#66798e">Structured nutrition programs</text>
    <circle cx="140" cy="615" r="22" fill="#f2eafe"/><text x="180" y="611" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="700" fill="#18314f">Corrective</text><text x="180" y="638" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17" fill="#66798e">Corrective movement programs</text>
    <rect x="610" y="345" width="380" height="300" rx="30" fill="url(#core)"/>
    <text x="800" y="450" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="76" font-weight="800" fill="#ffffff">django</text>
    <rect x="706" y="475" width="188" height="62" rx="18" fill="#18b884"/><text x="800" y="516" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" fill="#ffffff">REST API</text>
    <text x="800" y="585" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#c8d7e6">JWT · DRF · PostgreSQL</text>
    <rect x="1135" y="320" width="380" height="350" rx="28" fill="#ffffff"/>
    <text x="1175" y="370" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#10233f">Exercise Library</text>
    <text x="1175" y="415" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="700" fill="#18314f">Expandable by the coach</text>
    <text x="1175" y="455" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#66798e">Add new exercises over time</text>
    <text x="1175" y="493" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#66798e">Video · GIF · Image support</text>
    <text x="1175" y="531" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#66798e">Easy movement guidance</text>
    <rect x="1175" y="570" width="300" height="54" rx="16" fill="#edf7f3"/><text x="1325" y="603" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" font-weight="700" fill="#177b60">Seed data included · not a limit</text>
  </g>
  <path d="M465 495 C530 495 555 495 610 495" fill="none" stroke="#18b884" stroke-width="6" stroke-linecap="round"/><circle cx="540" cy="495" r="9" fill="#18b884"/>
  <path d="M990 495 C1045 495 1070 495 1135 495" fill="none" stroke="#3478d4" stroke-width="6" stroke-linecap="round"/><circle cx="1060" cy="495" r="9" fill="#3478d4"/>
  <rect x="305" y="700" width="990" height="70" rx="24" fill="#ffffff" filter="url(#shadow)"/>
  <text x="360" y="730" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="800" fill="#10233f">Students:</text>
  <text x="460" y="730" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" fill="#51647a">Online access · In-person coaching · Program archive</text>
  <text x="360" y="757" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" fill="#66798e">Goal: simpler coach workflows and easier student access to plans and movement media.</text>
  <text x="85" y="790" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="700" fill="#10233f">🚧 Active Development</text>
</svg>