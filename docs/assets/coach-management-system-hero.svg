<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="760" viewBox="0 0 1600 760" role="img" aria-labelledby="title desc">
  <title id="title">Coach Management System</title>
  <desc id="desc">Portfolio hero for a Persian-first Django REST Framework coaching management backend.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#eaf7f2"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10233f"/>
      <stop offset="1" stop-color="#173a55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#10233f" flood-opacity=".12"/>
    </filter>
  </defs>

  <rect width="1600" height="760" rx="36" fill="url(#bg)"/>
  <circle cx="150" cy="130" r="90" fill="#dff4ea"/>
  <circle cx="1450" cy="635" r="120" fill="#e4eefc"/>

  <text x="110" y="120" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="800" fill="#10233f">
    Coach <tspan fill="#14966f">Management</tspan> System
  </text>
  <text x="112" y="170" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" fill="#51647a">
    Persian-first coaching management backend built with Django REST Framework and PostgreSQL
  </text>

  <g font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="600">
    <rect x="110" y="210" width="175" height="52" rx="26" fill="#e4f7ef"/>
    <text x="145" y="244" fill="#176f58">JWT Auth</text>
    <rect x="305" y="210" width="175" height="52" rx="26" fill="#eaf1ff"/>
    <text x="344" y="244" fill="#2b63c0">Students</text>
    <rect x="500" y="210" width="185" height="52" rx="26" fill="#e4f7ef"/>
    <text x="539" y="244" fill="#176f58">Exercises</text>
    <rect x="705" y="210" width="195" height="52" rx="26" fill="#eaf1ff"/>
    <text x="742" y="244" fill="#2b63c0">PostgreSQL</text>
    <rect x="920" y="210" width="175" height="52" rx="26" fill="#e4f7ef"/>
    <text x="960" y="244" fill="#176f58">REST API</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="110" y="315" width="350" height="300" rx="28" fill="#ffffff"/>
    <text x="150" y="365" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#10233f">Students</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <circle cx="160" cy="420" r="24" fill="#dff4ea"/>
      <text x="205" y="416" font-size="22" font-weight="700" fill="#18314f">Student profile API</text>
      <text x="205" y="443" font-size="18" fill="#66798e">list · detail · update</text>
      <circle cx="160" cy="500" r="24" fill="#eaf1ff"/>
      <text x="205" y="496" font-size="22" font-weight="700" fill="#18314f">Coach controls</text>
      <text x="205" y="523" font-size="18" fill="#66798e">activate · deactivate</text>
      <circle cx="160" cy="580" r="24" fill="#fff1dc"/>
      <text x="205" y="576" font-size="22" font-weight="700" fill="#18314f">Persian-first UX</text>
      <text x="205" y="603" font-size="18" fill="#66798e">localized validation</text>
    </g>

    <rect x="625" y="315" width="350" height="300" rx="28" fill="url(#card)"/>
    <text x="800" y="405" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="72" font-weight="800" fill="#ffffff">django</text>
    <rect x="732" y="435" width="136" height="58" rx="18" fill="#18b884"/>
    <text x="800" y="474" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="800" fill="#ffffff">REST</text>
    <text x="800" y="545" text-anchor="middle" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" fill="#c8d7e6">JWT · PostgreSQL · DRF</text>

    <rect x="1140" y="315" width="350" height="300" rx="28" fill="#ffffff"/>
    <text x="1180" y="365" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="800" fill="#10233f">Exercise Bank</text>
    <g font-family="Inter,Segoe UI,Arial,sans-serif">
      <text x="1180" y="425" font-size="23" font-weight="700" fill="#18314f">100 seeded exercises</text>
      <text x="1180" y="460" font-size="20" fill="#66798e">MuscleGroup · Exercise</text>
      <text x="1180" y="493" font-size="20" fill="#66798e">ExerciseMedia</text>
      <rect x="1180" y="530" width="250" height="46" rx="14" fill="#edf7f3"/>
      <text x="1305" y="560" text-anchor="middle" font-size="19" font-weight="700" fill="#177b60">GIF · WebM · Image</text>
    </g>
  </g>

  <path d="M460 465 C530 465 555 465 625 465" fill="none" stroke="#18b884" stroke-width="6" stroke-linecap="round"/>
  <circle cx="540" cy="465" r="9" fill="#18b884"/>
  <path d="M975 465 C1045 465 1070 465 1140 465" fill="none" stroke="#3478d4" stroke-width="6" stroke-linecap="round"/>
  <circle cx="1060" cy="465" r="9" fill="#3478d4"/>

  <text x="110" y="690" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="24" font-weight="700" fill="#10233f">🚧 Active Development</text>
  <text x="355" y="690" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" fill="#66798e">Incremental backend development with implemented and planned features clearly separated.</text>
</svg>